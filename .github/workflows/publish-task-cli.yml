name: Publish @wadeck-app/task-cli

on:
    push:
        branches: [main, integration]
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ''
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

permissions:
    contents: read
    packages: write

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        outputs:
            dist_tag: ${{ steps.version.outputs.dist_tag }}
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build TypeScript
              run: npm run build --workspaces --if-present

            - name: Build Go launchers
              run: npm run build-launcher --workspace packages/task-cli

            - name: Compute version
              id: version
              run: bash ci/scripts/compute-version.sh
              env:
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  VERSION_INPUT: ${{ github.event.inputs.version }}
                  BREAKING_INPUT: ${{ github.event.inputs.breaking }}

            - name: Bundle
              run: npm run bundle --workspace packages/task-cli
              env:
                  BUNDLE_VERSION: ${{ steps.version.outputs.version }}

            - name: Generate platform package directories
              run: bash ci/scripts/generate-platform-packages.sh

            - name: Copy artifacts to platform packages
              run: bash ci/scripts/copy-binaries.sh task

            - name: Set version in all packages
              run: |
                  for pkg in task-cli-dist task-cli-win32-x64 task-cli-darwin-arm64 task-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm pkg set version="${{ steps.version.outputs.version }}")
                  done

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: task-cli-packages
                  path: packages/task-cli-*
                  retention-days: 1

    publish:
        needs: build-and-test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: task-cli-packages
                  path: packages

            - name: Publish platform packages
              run: |
                  for pkg in task-cli-win32-x64 task-cli-darwin-arm64 task-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm publish --tag ${{ needs.build-and-test.outputs.dist_tag }})
                  done
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish main package
              working-directory: packages/task-cli-dist
              run: npm publish --tag ${{ needs.build-and-test.outputs.dist_tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Tag as latest
              run: |
                  RAW_VER="${{ needs.build-and-test.outputs.version }}"
                  VER=$(printf '%s' "$RAW_VER" | sed 's/\.0\([0-9]\)/.\1/g')
                  for pkg in task-cli-win32-x64 task-cli-darwin-arm64 task-cli-darwin-x64 task-cli-dist; do
                    PKG=$(node -e "process.stdout.write(require('./packages/${pkg}/package.json').name)")
                    npm dist-tag add "${PKG}@${VER}" latest --registry https://npm.pkg.github.com/
                  done
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
