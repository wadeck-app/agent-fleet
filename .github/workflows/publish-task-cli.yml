name: Publish @wadeck/task-cli

env:
    GITLAB_NPM_REGISTRY_PATH: //gitlab.com/api/v4/projects/84445653/packages/npm/

on:
    push:
        branches: [main, integration]
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ""
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Configure GitLab npm registry (read -- for npm install)
              run: |
                  TOKEN=$(echo "${GITLAB_NPM_READ_TOKEN}" | tr -d '[:space:]')
                  if [ -z "$TOKEN" ]; then
                    echo "::error::GITLAB_NPM_READ_TOKEN is empty"
                    exit 1
                  fi
                  echo "READ token: ${TOKEN:0:9}*** (length: ${#TOKEN})"
                  echo "@wadeck:registry=https:${GITLAB_NPM_REGISTRY_PATH}" >> ~/.npmrc
                  echo "${GITLAB_NPM_REGISTRY_PATH}:_authToken=${TOKEN}" >> ~/.npmrc
                  echo "auth-type=legacy" >> ~/.npmrc
                  echo "=== whoami ===" && curl -s "https:${GITLAB_NPM_REGISTRY_PATH}-/whoami" -H "Authorization: Bearer ${TOKEN}"
                  echo ""
              env:
                  GITLAB_NPM_READ_TOKEN: ${{ secrets.GITLAB_NPM_READ_TOKEN }}

            - name: Install dependencies
              run: npm install --prefer-offline

            - name: Build TypeScript
              run: npm run build --workspaces --if-present

            - name: Bundle task CLI
              run: npm run bundle-task --workspace packages/flow-cli

            - name: Bundle updater
              run: npm run bundle-updater --workspace packages/flow-cli

            - name: Build Go launchers
              run: npm run build-launcher --workspace packages/flow-cli

            - name: Compute version
              id: version
              run: bash ci/scripts/compute-version.sh
              env:
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  VERSION_INPUT: ${{ github.event.inputs.version }}
                  BREAKING_INPUT: ${{ github.event.inputs.breaking }}

            - name: Copy artifacts to platform packages
              run: bash ci/scripts/copy-binaries.sh task

            - name: Set version in all packages
              run: |
                  for pkg in task-cli-dist task-cli-win32-x64 task-cli-darwin-arm64 task-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm version "${{ steps.version.outputs.version }}" --no-git-tag-version)
                  done

            - name: Configure GitLab npm registry (write -- for npm publish)
              run: |
                  TOKEN=$(echo "${GITLAB_NPM_WRITE_TOKEN}" | tr -d '[:space:]')
                  if [ -z "$TOKEN" ]; then
                    echo "::error::GITLAB_NPM_WRITE_TOKEN is empty"
                    exit 1
                  fi
                  echo "WRITE token: ${TOKEN:0:9}*** (length: ${#TOKEN})"
                  echo "@wadeck:registry=https:${GITLAB_NPM_REGISTRY_PATH}" >> .npmrc
                  echo "${GITLAB_NPM_REGISTRY_PATH}:_authToken=${TOKEN}" >> .npmrc
                  echo "auth-type=legacy" >> .npmrc
                  echo "=== .npmrc (token masked) ===" && sed 's/_authToken=.*/_authToken=***/' .npmrc
                  echo "=== whoami ===" && curl -s "https:${GITLAB_NPM_REGISTRY_PATH}-/whoami" -H "Authorization: Bearer ${TOKEN}"
                  echo ""
              env:
                  GITLAB_NPM_WRITE_TOKEN: ${{ secrets.GITLAB_NPM_WRITE_TOKEN }}

            - name: Publish platform packages
              run: |
                  for pkg in task-cli-win32-x64 task-cli-darwin-arm64 task-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm publish --tag ${{ steps.version.outputs.dist_tag }})
                  done

            - name: Publish main package
              working-directory: packages/task-cli-dist
              run: npm publish --tag ${{ steps.version.outputs.dist_tag }}
