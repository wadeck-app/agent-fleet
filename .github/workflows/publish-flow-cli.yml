name: Publish @wadeck-app/flow-cli

on:
    push:
        branches: [main, integration]
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ''
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

permissions:
    contents: read
    packages: write

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        outputs:
            dist_tag: ${{ steps.version.outputs.dist_tag }}
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build TypeScript
              run: npm run build --workspaces --if-present

            - name: Build Go launchers
              run: npm run build-launcher --workspace packages/flow-cli

            - name: Compute version
              id: version
              uses: wadeck-app/ci-templates/.github/actions/compute-version@main
              with:
                  version-input: ${{ github.event.inputs.version || '' }}
                  breaking-input: ${{ github.event.inputs.breaking || 'false' }}

            - name: Bundle flow CLI
              run: npm run bundle --workspace packages/flow-cli
              env:
                  BUNDLE_VERSION: ${{ steps.version.outputs.version }}

            - name: Generate platform package directories
              run: bash ci/scripts/generate-platform-packages.sh

            - name: Copy artifacts to platform packages
              run: bash ci/scripts/copy-binaries.sh

            - name: Set version in all packages
              run: |
                  for pkg in flow-cli-dist flow-cli-win32-x64 flow-cli-darwin-arm64 flow-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm pkg set version="${{ steps.version.outputs.version }}")
                  done

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: flow-cli-packages
                  path: packages/flow-cli-*
                  retention-days: 1

    # Runs in parallel with build-and-test and is NOT a dependency of publish: a red test job never blocks a
    # publication. continue-on-error keeps the workflow conclusion about the build and publish; the job itself
    # still shows its own result in the run. Unit suites only (scripts/test-config.js); the mock drift check is a
    # no-op in CI.
    unit-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        continue-on-error: true
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build TypeScript
              run: npm run build --workspaces --if-present

            - name: Unit tests
              run: npm run test:agent -- --type=unit

            - name: Upload test errors
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: unit-test-errors
                  path: test-errors.log
                  if-no-files-found: ignore
                  retention-days: 7

    publish:
        needs: build-and-test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: flow-cli-packages
                  path: packages

            - name: Publish platform packages
              run: |
                  for pkg in flow-cli-win32-x64 flow-cli-darwin-arm64 flow-cli-darwin-x64; do
                    (cd "packages/$pkg" && npm publish --tag ${{ needs.build-and-test.outputs.dist_tag }})
                  done
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish main package
              working-directory: packages/flow-cli-dist
              run: npm publish --tag ${{ needs.build-and-test.outputs.dist_tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
