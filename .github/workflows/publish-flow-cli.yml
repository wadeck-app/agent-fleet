name: Publish @wadeck-app/flow-cli

on:
    push:
        branches: [main, integration]
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ''
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

permissions:
    contents: read
    packages: write

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        outputs:
            dist_tag: ${{ steps.version.outputs.dist_tag }}
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build TypeScript
              run: npm run build --workspaces --if-present

            - name: Build Go launchers
              run: npm run build-launcher --workspace packages/flow-cli

            - name: Compute version
              id: version
              uses: wadeck-app/ci-templates/.github/actions/compute-version@main
              with:
                  version-input: ${{ github.event.inputs.version || '' }}
                  breaking-input: ${{ github.event.inputs.breaking || 'false' }}

            - name: Bundle flow CLI
              run: npm run bundle --workspace packages/flow-cli
              env:
                  BUNDLE_VERSION: ${{ steps.version.outputs.version }}

            - name: Generate platform package directories
              run: PLATFORMS=win32-x64,darwin-arm64,linux-x64 bash ci/scripts/generate-platform-packages.sh flow:worker.cjs:app-module/:app-module-flow-chart/

            - name: Copy artifacts to platform packages
              run: bash ci/scripts/copy-binaries.sh

            - name: Set version in all packages
              run: |
                  for pkg in flow-cli-dist flow-cli-win32-x64 flow-cli-darwin-arm64 flow-cli-linux-x64; do
                    (cd "packages/$pkg" && npm pkg set version="${{ steps.version.outputs.version }}")
                  done
                  # The generated optionalDependencies use the range ">=0.0.0-0", which a PRERELEASE version such as
                  # 2026.11.13-1007-ffa3e2df does not satisfy (semver): npm then installs no platform package at all
                  # (seen on macOS: "added 1 package"). Pin each platform package to the exact version of this build.
                  for platform in win32-x64 darwin-arm64 linux-x64; do
                    (cd packages/flow-cli-dist && npm pkg set "optionalDependencies.@wadeck-app/flow-cli-$platform=${{ steps.version.outputs.version }}")
                  done

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: flow-cli-packages
                  path: packages/flow-cli-*
                  retention-days: 1

    # Runs in parallel with build-and-test and is NOT a dependency of publish: a red test job never blocks a
    # publication. continue-on-error keeps the workflow conclusion about the build and publish; the job itself
    # still shows its own result in the run. Unit suites only (scripts/test-config.js); the mock drift check is a
    # no-op in CI.
    unit-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        continue-on-error: true
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Install dependencies
              run: npm ci
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build TypeScript
              run: npm run build --workspaces --if-present

            - name: Unit tests
              run: npm run test:agent -- --type=unit

            # The runner log only holds the suite summary (the failing test names are in test-errors.log): print the file
            # so a red job can be read without downloading the artifact.
            - name: Print test errors
              if: failure()
              run: cat test-errors.log || echo "::warning::test-errors.log was not written"

            - name: Upload test errors
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: unit-test-errors
                  path: test-errors.log
                  if-no-files-found: ignore
                  retention-days: 7

    publish:
        needs: build-and-test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: flow-cli-packages
                  path: packages

            # upload/download-artifact do not keep file modes: without this the darwin and linux binaries are packed as 0644.
            - name: Restore executable bits
              run: bash ci/scripts/restore-exec-bits.sh packages flow win32-x64,darwin-arm64,linux-x64

            - name: Publish platform packages
              run: |
                  for pkg in flow-cli-win32-x64 flow-cli-darwin-arm64 flow-cli-linux-x64; do
                    (cd "packages/$pkg" && npm publish --tag ${{ needs.build-and-test.outputs.dist_tag }})
                  done
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish main package
              working-directory: packages/flow-cli-dist
              run: npm publish --tag ${{ needs.build-and-test.outputs.dist_tag }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Installs the package that was just published on a real macOS arm64 runner and runs it: a launcher that cannot be
    # executed (lost exec bit) once exited in ~60 ms with no output. Nothing depends on it and it cannot fail the run
    # (continue-on-error). Runner label: `macos-latest` (the label project-owner's pipeline gets a runner with); the
    # previous attempt on `macos-14` was cancelled after 1 s, cause unproven. If this job is cancelled again, remove it:
    # a cancelled job turned the whole run into `cancelled` (runs 432-435) and broke `queue wait ci`.
    smoke-macos:
        needs: [build-and-test, publish]
        runs-on: macos-latest
        timeout-minutes: 15
        continue-on-error: true
        steps:
            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@wadeck-app'

            - name: Install the published CLI
              run: npm install -g "@wadeck-app/flow-cli@${{ needs.build-and-test.outputs.version }}"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: The platform binary is executable
              run: |
                  bin="$(find "$(npm root -g)" -path '*flow-cli-darwin-arm64/flow' -type f | head -n 1)"
                  test -n "$bin" || { echo "::error::the darwin arm64 platform binary was not installed"; exit 1; }
                  if [ ! -x "$bin" ]; then
                    echo "::error::$bin is not executable (mode: $(stat -f '%Sp' "$bin" 2>&1))"
                    exit 1
                  fi

            - name: flow --version prints the published version
              run: |
                  out="$(flow --version)"
                  echo "flow --version: $out"
                  test -n "$out" || { echo "::error::flow --version printed nothing"; exit 1; }
                  case "$out" in *"${{ needs.build-and-test.outputs.version }}"*) ;; *) echo "::error::unexpected version: $out"; exit 1;; esac
