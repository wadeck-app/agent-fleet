name: Publish @wadeck/flow-cli

on:
    push:
        branches: [main, integration]
    workflow_dispatch:
        inputs:
            version:
                description: 'Stable version (e.g. 1.2.0)'
                required: false
                default: ""
            breaking:
                description: 'Breaking change? (true/false)'
                required: false
                default: 'false'

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Validate secrets
              run: |
                  fail=0

                  # 1. Presence + first chars (to identify which token is loaded without exposing it)
                  if [ -z "${GITLAB_NPM_READ_TOKEN}" ]; then
                    echo "::error::GITLAB_NPM_READ_TOKEN is not set or empty"
                    fail=1
                  else
                    echo "GITLAB_NPM_READ_TOKEN: ${GITLAB_NPM_READ_TOKEN:0:10}... (length: ${#GITLAB_NPM_READ_TOKEN})"
                  fi
                  if [ -z "${GITLAB_NPM_WRITE_TOKEN}" ]; then
                    echo "::error::GITLAB_NPM_WRITE_TOKEN is not set or empty"
                    fail=1
                  else
                    echo "GITLAB_NPM_WRITE_TOKEN: ${GITLAB_NPM_WRITE_TOKEN:0:10}... (length: ${#GITLAB_NPM_WRITE_TOKEN})"
                  fi
                  [ "$fail" -eq 1 ] && exit 1

                  # 2. Format (GitLab tokens start with glpat- or gldt-)
                  if ! echo "${GITLAB_NPM_READ_TOKEN}" | grep -qE '^(glpat|gldt)-'; then
                    echo "::warning::GITLAB_NPM_READ_TOKEN format unexpected (not glpat-* or gldt-*) -- may be a legacy token"
                  fi
                  if ! echo "${GITLAB_NPM_WRITE_TOKEN}" | grep -qE '^(glpat|gldt)-'; then
                    echo "::warning::GITLAB_NPM_WRITE_TOKEN format unexpected (not glpat-* or gldt-*) -- may be a legacy token"
                  fi

                  # 3. Scope validation -- deploy tokens do not expose an introspection API,
                  #    so we validate by reading a known package and checking the HTTP status.
                  check_read() {
                    local token="$1" label="$2"
                    HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
                      -H "Authorization: Bearer ${token}" \
                      "https://gitlab.com/api/v4/projects/84445653/packages/npm/@wadeck%2fsingleton-daemon-kit")
                    case "$HTTP" in
                      200) echo "::notice::${label}: read_package_registry OK (HTTP 200)" ;;
                      401) echo "::error::${label}: invalid or expired token (HTTP 401)" ; return 1 ;;
                      403) echo "::error::${label}: token lacks read_package_registry scope (HTTP 403)" ; return 1 ;;
                      404) echo "::error::${label}: project 84445653 not found or token has no visibility (HTTP 404)" ; return 1 ;;
                      *)   echo "::error::${label}: unexpected HTTP ${HTTP} from GitLab registry" ; return 1 ;;
                    esac
                  }
                  check_read "${GITLAB_NPM_READ_TOKEN}"  "GITLAB_NPM_READ_TOKEN"  || exit 1
                  check_read "${GITLAB_NPM_WRITE_TOKEN}" "GITLAB_NPM_WRITE_TOKEN" || echo "::warning::GITLAB_NPM_WRITE_TOKEN cannot read (write-only token is OK if registry allows it)"
                  echo "Secrets validated."
              env:
                  GITLAB_NPM_READ_TOKEN: ${{ secrets.GITLAB_NPM_READ_TOKEN }}
                  GITLAB_NPM_WRITE_TOKEN: ${{ secrets.GITLAB_NPM_WRITE_TOKEN }}

            - name: Configure GitLab npm registry
              run: |
                  echo "@wadeck:registry=https://gitlab.com/api/v4/packages/npm/" >> ~/.npmrc
                  echo "//gitlab.com/api/v4/packages/npm/:_authToken=${GITLAB_NPM_READ_TOKEN}" >> ~/.npmrc
                  echo "//gitlab.com/api/v4/projects/84445653/packages/npm/:_authToken=${GITLAB_NPM_READ_TOKEN}" >> ~/.npmrc
                  echo "auth-type=legacy" >> ~/.npmrc
              env:
                  GITLAB_NPM_READ_TOKEN: ${{ secrets.GITLAB_NPM_READ_TOKEN }}

            - name: Install dependencies
              run: npm install --prefer-offline

            - name: Build TypeScript
              run: npm run build --workspaces --if-present

            - name: Bundle flow CLI
              run: npm run bundle:all --workspace packages/flow-cli

            - name: Build Go launchers
              run: npm run build-launcher --workspace packages/flow-cli

            - name: Compute version
              id: version
              run: bash ci/scripts/compute-version.sh
              env:
                  GITHUB_EVENT_NAME: ${{ github.event_name }}
                  VERSION_INPUT: ${{ github.event.inputs.version }}
                  BREAKING_INPUT: ${{ github.event.inputs.breaking }}

            - name: Copy artifacts to platform packages
              run: bash ci/scripts/copy-binaries.sh flow

            - name: Set version in all packages
              run: |
                  for pkg in flow-cli-dist flow-cli-win32-x64 flow-cli-darwin-arm64 flow-cli-darwin-x64; do
                    npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --prefix "packages/$pkg"
                  done

            - name: Configure GitLab npm registry for publish
              run: |
                  echo "//gitlab.com/api/v4/packages/npm/:_authToken=${GITLAB_NPM_WRITE_TOKEN}" >> ~/.npmrc
                  echo "//gitlab.com/api/v4/projects/84445653/packages/npm/:_authToken=${GITLAB_NPM_WRITE_TOKEN}" >> ~/.npmrc
              env:
                  GITLAB_NPM_WRITE_TOKEN: ${{ secrets.GITLAB_NPM_WRITE_TOKEN }}

            - name: Publish platform packages
              run: |
                  for pkg in flow-cli-win32-x64 flow-cli-darwin-arm64 flow-cli-darwin-x64; do
                    npm publish --prefix "packages/$pkg"
                  done

            - name: Publish main package
              run: npm publish --workspace packages/flow-cli-dist --tag ${{ steps.version.outputs.dist_tag }}
