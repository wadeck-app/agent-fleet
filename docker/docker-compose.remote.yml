# ===========================================================================================
# DOCKER COMPOSE - REMOTE MODE
# ===========================================================================================
#
# Multi-container setup for remote mode:
# - orchestrator-server: Standalone orchestrator service
# - backend: Backend connecting to orchestrator-server via HTTP/WebSocket
#
# Usage:
#   docker-compose -f docker/docker-compose.remote.yml up
#
# ===========================================================================================

version: '3.8'

services:
    # =======================================================================================
    # ORCHESTRATOR SERVER
    # =======================================================================================
    orchestrator-server:
        build:
            context: ..
            dockerfile: docker/Dockerfile.orchestrator-server
        container_name: orchestrator-server
        ports:
            - '3737:3737'
        environment:
            - NODE_ENV=production
            - ORCHESTRATOR_SERVER_PORT=3737
            - ORCHESTRATOR_WS_PORT=3738
            - ORCHESTRATOR_REST_PORT=3737
        networks:
            - agent-fleet
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3737/health']
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    # =======================================================================================
    # BACKEND (Remote Mode)
    # =======================================================================================
    backend:
        build:
            context: ..
            dockerfile: docker/Dockerfile.backend-remote
        container_name: backend-remote
        ports:
            - '3000:3000'
        environment:
            - NODE_ENV=production
            - ORCHESTRATOR_MODE=remote
            - ORCHESTRATOR_URL=http://orchestrator-server:3737
            - ORCHESTRATOR_TRANSPORT=auto
            - PORT=3000
            - CORS_ORIGIN=http://localhost:5173
        depends_on:
            orchestrator-server:
                condition: service_healthy
        networks:
            - agent-fleet
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/health']
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 15s

networks:
    agent-fleet:
        driver: bridge
