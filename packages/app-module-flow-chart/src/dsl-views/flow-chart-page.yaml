# Chart of a flow definition (no step state), mounted at /modules/flow-chart/flows/:flowId.
# The component loads GET /api/modules/flow-chart/graph itself, to show the API's own error text. The way back to
# the flow list is the breadcrumb of the shell.
$type: PageContent
sections:
    - $type: flow-chart:FlowGraph
      flowId: $route.flowId
