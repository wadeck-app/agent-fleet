# Flow charts index (nav): the flows that ran on this machine. A row opens the chart of the flow definition;
# the chart of one run is reached from that execution's page ("See flow chart").
# Short precomputed text and three columns: the DataTable keeps only key and label of a column (no format, no width) and
# breaks a cell anywhere, so a raw ISO timestamp would wrap mid-number on a narrow page.
# Pagination and page size live in the URL (?page=&size=), like the executions page of the flow module.
$sources:
    flows:
        url: GET /api/modules/flow-chart/flows
        params:
            page: $urlParam.page
            limit: $urlParam.size

$type: PageContent
sections:
    - $type: PageHeader
      title: Flow charts
      subtitle: Click a flow to see its steps and how they depend on each other

    - $type: DataTable
      rows: $sources.flows.flows
      navigateTo: '/modules/flow-chart/flows/{flowId}'
      emptyMessage: No flow has run yet. Run a flow (flow run <file>) and it will be listed here.
      columns:
          - { key: 'flowId', label: 'Flow' }
          - { key: 'executionCount', label: 'Runs' }
          - { key: 'failedCount', label: 'Failed' }
          - { key: 'lastStartedLabel', label: 'Last' }

    - $type: HorizontalStack
      justify: justify-between
      align: items-center
      gap: gap-3
      items:
          - $type: Pagination
            urlParam: page
            total: $sources.flows.total
            size: $sources.flows.limit

          # Shows options[0] while ?size= is absent: it must be the backend default page size (views.test.ts).
          - $type: PageSizeSelect
            urlParam: size
            options: [20, 50, 100]
