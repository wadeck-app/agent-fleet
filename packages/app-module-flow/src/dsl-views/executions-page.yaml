# Executions history (`flow history`). Filters and pagination live in the URL: ?status=failed&flow=deploy&page=1&size=50
# Three page structures are declared as an A/B test (README: "Design variants"); the dev shell's A/B dock picks one,
# `table` is what everybody else sees. The sections they share are YAML anchors defined in the first variant that uses
# them (`&filterRow`, `&executionsTable`, `&pager`, `&flowsTable`): keep that variant, or move the anchors, when
# removing variants.
# Filters: a search box on the flow name (?flow=, a case-insensitive substring: the source forwards it to the route as
# flowContains) and a select on the status (?status=). Both are real controls bound to the URL (SearchBar/CompactSelect
# `urlParam`, dsl-ui >= 2026.10.19-117); `resetUrlParams: [page]` (>= 2026.10.22-124) sends a changed filter back to
# page 1. A shell older than 124 keeps the stale ?page= and may show an empty page: the table then says so.
# Clicking a row of the flows table sets ?flow=<flowId>, which the search box shows.
# Times are ISO 8601 (startedAt, lastStartedAt) and every column of them is `format: datetime`: the shell prints them
# like every table of app-core (dsl-ui DataTable, e.g. "10/18/26, 4:15 PM" in en-US). A shell older than dsl-ui 122
# ignores `format` and shows the raw ISO text.
# Run columns: the route sends the full flow name and the full execution id. The flow column is `truncate`: the
# DataTable cuts it with an ellipsis (full text as tooltip) only when the viewport needs it; the id column is nowrap and
# mono, so the run id stays visible. statusLabel is a short ASCII word ("ok", "FAILED", "ok, recovered"), badged when it
# is a bare word. The error of a run is on its detail page: a cell cannot hold a second line.
# The empty message comes from the route (emptyMessage): a page past the end, a filter without match and an install
# where nothing ran need different words.
# Row click opens the detail page. The chevron of a row opens a panel (DataTable `expansion`) with the links of the
# run, because a DataTable cell cannot hold a link and a row action can only call an $actions handler, not navigate:
# Logs (this module) and the slot "flow:execution-row-actions" (manifest expose.slots): other modules add their own links
# per run (flow-chart adds its chart button). The panel
# gets the row as $ctx.row (whole-string expressions only, so a contribution reads $ctx.row.executionId and the like).
# Slot "flow:executions-actions" (manifest expose.slots): other modules add page-level buttons next to the filters, in
# every variant.
$sources:
    actions:
        url: GET /api/slots/flow:executions-actions
    rowActions:
        url: GET /api/slots/flow:execution-row-actions
    flows:
        url: GET /api/modules/flow/flows?limit=8
    flowsTop:
        url: GET /api/modules/flow/flows?limit=5
    executions:
        url: GET /api/modules/flow/executions
        params:
            status: $urlParam.status
            flowContains: $urlParam.flow
            page: $urlParam.page
            limit: $urlParam.size

$type: PageContent
sections:
    - $type: AbTest
      id: flow-executions-design
      label: Executions page
      initial: table
      variants:
          table:
              label: Table
              hint: 'Filters, the executions table, then the flows table below: everything on one page.'
              view:
                  $type: VerticalStack
                  gap: gap-4
                  items:
                      - $type: PageHeader
                        title: Flow executions
                        subtitle: 'Search a flow or pick a status; click a flow below to see only its executions, open a row for its chart and logs'

                      - &filterRow
                        $type: HorizontalStack
                        gap: gap-3
                        align: items-center
                        justify: justify-between
                        items:
                            - $type: HorizontalStack
                              gap: gap-3
                              align: items-center
                              items:
                                  - $type: SearchBar
                                    urlParam: flow
                                    resetUrlParams: [page]
                                    placeholder: Flow name
                                  # The placeholder is the empty choice: no ?status=, every status.
                                  - $type: CompactSelect
                                    urlParam: status
                                    resetUrlParams: [page]
                                    ariaLabel: Status
                                    placeholder: Any status
                                    options:
                                        - { value: completed, label: OK }
                                        - { value: failed, label: Failed }
                                        - { value: running, label: Running }
                                        - { value: queued, label: Waiting }
                                        - { value: recovered, label: Recovered }

                            # Renders nothing while no module contributes.
                            - &actionsSlot
                              $type: ExtensionSlot
                              items: $sources.actions

                      - &executionsTable
                        $type: DataTable
                        rows: $sources.executions.items
                        navigateTo: '/modules/flow/executions/{executionId}'
                        emptyMessage: $sources.executions.emptyMessage
                        expansion:
                            $type: HorizontalStack
                            gap: gap-3
                            align: items-center
                            items:
                                - { $type: Link, label: Logs, href: $ctx.row.logsHref }
                                # Renders nothing while no module contributes.
                                - $type: ExtensionSlot
                                  items: $sources.rowActions
                        columns:
                            - { key: 'startedAt', label: 'When', format: datetime, nowrap: true }
                            - { key: 'flowId', label: 'Flow', truncate: true, mono: true }
                            - { key: 'executionId', label: 'Run', nowrap: true, mono: true }
                            # The cell text stays the status word: a shell older than dsl-ui 122 ignores nowrap and badge and shows it as is.
                            # The badge colours a cell whose text is exactly a key; "ok, 3 tries" and the like stay plain text.
                            - key: statusLabel
                              label: Status
                              nowrap: true
                              badge:
                                  {
                                      ok: success,
                                      FAILED: danger,
                                      running: info,
                                      waiting: default,
                                      retry: warning,
                                      'ok, recovered': warning,
                                  }

                      - &pager
                        $type: HorizontalStack
                        justify: justify-between
                        align: items-center
                        gap: gap-3
                        items:
                            - $type: Pagination
                              urlParam: page
                              total: $sources.executions.total
                              size: $sources.executions.limit

                            # With urlParam the component reads and writes ?size= itself (its `value` is ignored), and shows options[0] while
                            # the parameter is absent: that must be the backend's default page size (checked in views.test.ts).
                            - $type: PageSizeSelect
                              urlParam: size
                              resetUrlParams: [page]
                              options: [20, 50, 100]

                      - $type: Section
                        title: $sources.flows.caption
                        items:
                            - &flowsTable
                              $type: DataTable
                              rows: $sources.flows.flows
                              navigateTo: '/modules/flow/executions?flow={flowId}'
                              emptyMessage: No flow has run yet
                              columns:
                                  - { key: 'flowId', label: 'Flow', truncate: true, mono: true }
                                  - { key: 'executionCount', label: 'Runs', nowrap: true }
                                  - { key: 'failedCount', label: 'Failed', nowrap: true }
                                  - { key: 'lastStartedAt', label: 'Last', format: datetime, nowrap: true }

          filters-first:
              label: Filters first
              hint: 'Filters, the table, and the flows folded behind a Flows header.'
              view:
                  $type: VerticalStack
                  gap: gap-4
                  items:
                      - $type: PageHeader
                        title: Flow executions
                        subtitle: Search a flow or pick a status, open a row for its chart and logs

                      - *filterRow
                      - *executionsTable
                      - *pager

                      - $type: Collapsible
                        title: Flows
                        defaultOpen: false
                        items:
                            - *flowsTable

          flows-aside:
              label: Flows aside
              hint: 'The 5 most recent flows as a small table above the executions: one click filters by flow.'
              view:
                  $type: VerticalStack
                  gap: gap-4
                  items:
                      - $type: PageHeader
                        title: Flow executions
                        subtitle: 'Search a flow or pick a status, or click one of the latest flows (?flow=<flowId>)'

                      - $type: Section
                        title: Latest flows
                        items:
                            - $type: DataTable
                              rows: $sources.flowsTop.flows
                              navigateTo: '/modules/flow/executions?flow={flowId}'
                              emptyMessage: No flow has run yet
                              columns:
                                  - { key: 'flowId', label: 'Flow', truncate: true, mono: true }
                                  - { key: 'executionCount', label: 'Runs', nowrap: true }
                                  - { key: 'failedCount', label: 'Failed', nowrap: true }
                                  - { key: 'lastStartedAt', label: 'Last', format: datetime, nowrap: true }

                      - *filterRow
                      - *executionsTable
                      - *pager
