# Executions history (`flow history`). Filters and pagination live in the URL: ?status=failed&flow=deploy&page=1&size=50
# The status links reload the page with the filter applied. The flow filter is the `flow` URL parameter, set by clicking
# a row of the "Flows" table (GET /flows?limit=N, the most recent flows: the executions come first, they are the page).
# Cells show what the routes precompute (startedLabel, errorExcerpt): the DataTable renders every
# YAML-column cell as `break-all` and keeps only key and label of a column, so width/truncate/format/muted cannot be set. A free-text/select control bound to ?flow= needs a dsl-ui change: today only
# Pagination and PageSizeSelect take `urlParam`, and SearchBar/CompactSelect cannot read the URL back into `value`.
# Slot "flow:executions-actions" (manifest expose.slots): other modules add page-level buttons next to the status links.
# DataTable has no per-row slot (its row actions are static), so nothing is contributed per row.
$sources:
    actions:
        url: GET /api/slots/flow:executions-actions
    flows:
        url: GET /api/modules/flow/flows?limit=8
    executions:
        url: GET /api/modules/flow/executions
        params:
            status: $urlParam.status
            flow: $urlParam.flow
            page: $urlParam.page
            limit: $urlParam.size

$type: PageContent
sections:
    - $type: PageHeader
      title: Flow executions
      subtitle: 'Filter by status, or click a flow below to see only its executions (?flow=<flowId>)'

    - $type: HorizontalStack
      gap: gap-3
      align: items-center
      justify: justify-between
      items:
          - $type: HorizontalStack
            gap: gap-3
            align: items-center
            items:
                - { $type: Link, label: All, href: /modules/flow/executions }
                - { $type: Link, label: Running, href: '/modules/flow/executions?status=running' }
                - { $type: Link, label: Queued, href: '/modules/flow/executions?status=queued' }
                - { $type: Link, label: Completed, href: '/modules/flow/executions?status=completed' }
                - { $type: Link, label: Failed, href: '/modules/flow/executions?status=failed', variant: danger }

          # Renders nothing while no module contributes.
          - $type: ExtensionSlot
            items: $sources.actions

    - $type: DataTable
      rows: $sources.executions.items
      navigateTo: '/modules/flow/executions/{executionId}'
      emptyMessage: No execution matches
      columns:
          - { key: 'startedLabel', label: 'Started' }
          - { key: 'flowId', label: 'Flow' }
          - { key: 'status', label: 'Status' }
          - { key: 'executionId', label: 'Execution' }
          - { key: 'errorExcerpt', label: 'Last error' }

    - $type: HorizontalStack
      justify: justify-between
      align: items-center
      gap: gap-3
      items:
          - $type: Pagination
            urlParam: page
            total: $sources.executions.total
            size: $sources.executions.limit

          # With urlParam the component reads and writes ?size= itself (its `value` is ignored), and shows options[0]
          # while the parameter is absent: that must be the backend's default page size (checked in views.test.ts).
          - $type: PageSizeSelect
            urlParam: size
            options: [20, 50, 100]

    - $type: Section
      title: $sources.flows.caption
      items:
          - $type: DataTable
            rows: $sources.flows.flows
            navigateTo: '/modules/flow/executions?flow={flowId}'
            emptyMessage: No flow has run yet
            columns:
                - { key: 'flowId', label: 'Flow' }
                - { key: 'executionCount', label: 'Runs' }
                - { key: 'failedCount', label: 'Failed' }
                - { key: 'lastStartedLabel', label: 'Last started' }
