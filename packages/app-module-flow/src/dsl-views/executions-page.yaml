# Executions history (`flow history`). Filters and pagination live in the URL: ?status=failed&flow=deploy&page=1&size=50
# Filters: a search box on the flow name (?flow=, a case-insensitive substring: the source forwards it to the route as
# flowContains) and a select on the status (?status=). Both are real controls bound to the URL (SearchBar/CompactSelect
# `urlParam`, dsl-ui >= 2026.10.19-117); `resetUrlParams: [page]` (>= 2026.10.22-124) sends a changed filter back to
# page 1. A shell older than 124 keeps the stale ?page= and may show an empty page: the table then says so.
# Clicking a row of the flows table sets ?flow=<flowId>, which the search box shows.
# Times are ISO 8601 (startedAt, lastStartedAt) and every column of them is `format: datetime`: the shell prints them
# like every table of app-core (dsl-ui DataTable, the user's date settings: e.g. "24/10/2026, 18:38" by default, `dateStyle: short`).
# The module requires dsl-ui >= 2026.10.26-290 (manifest dslLib), which has the central date formatter.
# Run columns: the route sends the full flow name and the full execution id. The flow column is `truncate`: the
# DataTable cuts it with an ellipsis (full text as tooltip) only when the viewport needs it; the id column is nowrap and
# mono, so the run id stays visible. statusLabel is a short ASCII word ("ok", "FAILED", "ok, recovered"), badged when it
# is a bare word. The error of a run is on its detail page: a cell cannot hold a second line.
# The empty message comes from the route (emptyMessage): a page past the end, a filter without match and an install
# where nothing ran need different words.
# The rows of the executions table are NOT clickable (no navigateTo). The first column is an icon-only router link
# (`type: link`, `position: start`: right after the expansion chevron, dsl-ui >= 2026.10.24-153) to the detail page; its
# `label` is the aria-label and tooltip, `{executionId}` is filled from the row (percent-encoded). views.test.ts pins that
# the template equals flow-core's executionPagePath. The chevron of a row opens a panel (DataTable `expansion`) that
# reads: the slot "flow:execution-row-links" (flow-chart adds "Flow definition"), Logs (this module), then the slot
# "flow:execution-row-actions" (flow-chart adds "Flow chart"). The panel gets the row as $ctx.row (whole-string
# expressions only, so a contribution reads $ctx.row.executionId and the like).
# Slot "flow:executions-actions" (manifest expose.slots): other modules add page-level buttons next to the filters.
$sources:
    actions:
        url: GET /api/slots/flow:executions-actions
    rowLinks:
        url: GET /api/slots/flow:execution-row-links
    rowActions:
        url: GET /api/slots/flow:execution-row-actions
    flows:
        url: GET /api/modules/flow/flows?limit=8
    executions:
        url: GET /api/modules/flow/executions
        params:
            status: $urlParam.status
            flowContains: $urlParam.flow
            # ?project=<projectId> (8 hex chars) keeps the runs of one project.
            projectId: $urlParam.project
            page: $urlParam.page
            limit: $urlParam.size

$type: PageContent
sections:
    - $type: VerticalStack
      gap: gap-4
      items:
          - $type: PageHeader
            title: Flow executions
            subtitle: 'Search a flow or pick a status; click a flow below to see only its executions, open a run with the icon at the start of its row, or its chevron for logs and charts'

          - $type: HorizontalStack
            gap: gap-3
            align: items-center
            justify: justify-between
            items:
                - $type: HorizontalStack
                  gap: gap-3
                  align: items-center
                  items:
                      - $type: SearchBar
                        urlParam: flow
                        resetUrlParams: [page]
                        placeholder: Flow name
                      # The placeholder is the empty choice: no ?status=, every status.
                      - $type: CompactSelect
                        urlParam: status
                        resetUrlParams: [page]
                        ariaLabel: Status
                        placeholder: Any status
                        options:
                            - { value: completed, label: OK }
                            - { value: failed, label: Failed }
                            - { value: running, label: Running }
                            - { value: queued, label: Waiting }
                            - { value: recovered, label: Recovered }

                # Renders nothing while no module contributes.
                - $type: ExtensionSlot
                  items: $sources.actions

          # The section title is the route's countLabel ("110 failed executions": the total of every page under the active
          # filters), so the number of a dashboard tile can be compared with this list.
          - $type: Section
            title: $sources.executions.countLabel
            items:
                - $type: DataTable
                  rows: $sources.executions.items
                  emptyMessage: $sources.executions.emptyMessage
                  expansion:
                      $type: HorizontalStack
                      gap: gap-2
                      align: items-center
                      items:
                          # Each slot renders nothing while no module contributes.
                          - $type: ExtensionSlot
                            items: $sources.rowLinks
                          - { $type: ButtonLink, label: Logs, to: $ctx.row.logsHref, variant: secondary, size: sm }
                          - $type: ExtensionSlot
                            items: $sources.rowActions
                  columns:
                      - {
                            type: link,
                            to: '/modules/flow/executions/{executionId}',
                            icon: eye,
                            label: Open details,
                            position: start,
                        }
                      - { key: 'startedAt', label: 'When', format: datetime, dateStyle: short, nowrap: true }
                      - { key: 'flowId', label: 'Flow', truncate: true, mono: true }
                      - { key: 'versionLabel', label: 'Version', nowrap: true, mono: true }
                      - { key: 'executionId', label: 'Run', nowrap: true, mono: true }
                      # The cell text stays the status word: a shell older than dsl-ui 122 ignores nowrap and badge and shows it as is.
                      # The badge colours a cell whose text is exactly a key; "ok, 3 tries" and the like stay plain text.
                      - key: statusLabel
                        label: Status
                        nowrap: true
                        badge:
                            {
                                ok: success,
                                FAILED: danger,
                                running: info,
                                waiting: default,
                                retry: warning,
                                'ok, recovered': warning,
                            }

          - $type: HorizontalStack
            justify: justify-between
            align: items-center
            gap: gap-3
            items:
                - $type: Pagination
                  urlParam: page
                  total: $sources.executions.total
                  size: $sources.executions.limit

                # With urlParam the component reads and writes ?size= itself (its `value` is ignored), and shows options[0] while
                # the parameter is absent: that must be the backend's default page size (checked in views.test.ts).
                - $type: PageSizeSelect
                  urlParam: size
                  resetUrlParams: [page]
                  options: [20, 50, 100]

          - $type: Section
            title: $sources.flows.caption
            items:
                - $type: DataTable
                  rows: $sources.flows.flows
                  navigateTo: '/modules/flow/executions?flow={flowId}'
                  emptyMessage: No flow has run yet
                  columns:
                      - { key: 'flowId', label: 'Flow', truncate: true, mono: true }
                      - { key: 'executionCount', label: 'Runs', nowrap: true }
                      - { key: 'failedCount', label: 'Failed', nowrap: true }
                      - { key: 'lastStartedAt', label: 'Last', format: datetime, dateStyle: short, nowrap: true }
