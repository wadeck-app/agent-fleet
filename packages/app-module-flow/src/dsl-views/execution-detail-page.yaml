# Execution detail (`flow show <id>`), mounted at /modules/flow/executions/:id. ":id" of the manifest path is $route.id.
# ?tail=<chars> sets how much of a failed step's output is kept; ?full=true lifts the limit.
# There is no "Back to executions" link: the shell shows a breadcrumb.
# Buttons, left to right: the slot "flow:execution-links" (flow-chart adds "Flow definition"), Logs (this module; logsHref
# is a path the route builds: a DSL string cannot be concatenated), then the slot "flow:execution-actions" (flow-chart
# adds "Flow chart"). Two slots because a slot renders where the view puts it: a contribution can only precede an own
# button through its own slot. Their views are rendered with this page's context, so they can read $route.id and
# $sources.execution.<field> (whole-string expressions only).
# Times are ISO 8601 and shown by table columns with `format: datetime`, the shell formatter of every app-core table:
# the run start and end are a one-row table (`timing`: a Badge or a StatTile cannot format a timestamp), a step start is
# a column. A shell older than dsl-ui 122 ignores `format` and shows the raw ISO text.
# The steps table has short columns (a narrow page breaks longer cells mid-word): the status word carries recovered
# errors ("ok, recovered"), coloured by `badge` when it is a bare word; the error text is in the output below.
# The Retries column is a badge too: its texts are the small fixed set of flow-core RETRY_BADGE_VARIANTS (views.test.ts
# compares this map with it). The retries of a step are attempts - 1, shown even when 0.
$sources:
    execution:
        # A placeholder is filled from params; the module id stays literal.
        url: GET /api/modules/flow/executions/{id}
        params:
            id: $route.id
            tail: $urlParam.tail
            full: $urlParam.full
    links:
        url: GET /api/slots/flow:execution-links
    actions:
        url: GET /api/slots/flow:execution-actions

$type: PageContent
sections:
    - $type: VerticalStack
      gap: gap-4
      items:
          - $type: PageHeader
            title: $sources.execution.flowId
            subtitle: $sources.execution.executionId

          - $type: HorizontalStack
            gap: gap-3
            align: items-center
            justify: justify-between
            items:
                - $type: HorizontalStack
                  gap: gap-3
                  align: items-center
                  items:
                      - {
                            $type: Badge,
                            label: $sources.execution.statusText,
                            variant: $sources.execution.statusVariant,
                            tone: subtle,
                        }
                      - { $type: Badge, label: $sources.execution.duration, variant: info }

                - $type: HorizontalStack
                  gap: gap-2
                  align: items-center
                  items:
                      # Each slot renders nothing while no module contributes.
                      - $type: ExtensionSlot
                        items: $sources.links
                      - {
                            $type: ButtonLink,
                            size: sm,
                            variant: secondary,
                            label: Logs,
                            to: $sources.execution.logsHref,
                        }
                      - $type: ExtensionSlot
                        items: $sources.actions

          - $type: DataTable
            rows: $sources.execution.timing
            columns:
                - { key: 'startedAt', label: 'Started', format: datetime, nowrap: true }
                - { key: 'completedAt', label: 'Finished', format: datetime, nowrap: true }

          - $type: Section
            title: Steps
            items:
                - $type: DataTable
                  rows: $sources.execution.steps
                  emptyMessage: This execution has no step
                  columns:
                      - { key: 'stepId', label: 'Step', truncate: true, mono: true }
                      - key: statusLabel
                        label: Status
                        nowrap: true
                        badge:
                            {
                                ok: success,
                                FAILED: danger,
                                running: info,
                                waiting: default,
                                pending: default,
                                retry: warning,
                                'ok, recovered': warning,
                            }
                      - { key: 'duration', label: 'Duration', nowrap: true, muted: true }
                      - key: retryLabel
                        label: Retries
                        nowrap: true
                        badge:
                            {
                                '0 retry': success,
                                '1 retry': warning,
                                '2 retries': warning,
                                '3+ retries': warning,
                                'no retry left': danger,
                                'retry policy unknown': default,
                                'retries unknown': default,
                            }
                      - { key: 'startedAt', label: 'Started', format: datetime, nowrap: true }

          # Collapsed: the values can be long. Same text as `flow show <id> --io` under each step (ioText).
          - $type: Collapsible
            title: Inputs / outputs
            defaultOpen: false
            items:
                - $type: JsonViewer
                  row: $sources.execution
                  field: ioText
                  maxHeight: 40rem

          - $type: Section
            title: Output (same text as `flow show`, with the error and the tail of failed steps)
            items:
                - $type: JsonViewer
                  row: $sources.execution
                  field: text
                  maxHeight: 40rem
