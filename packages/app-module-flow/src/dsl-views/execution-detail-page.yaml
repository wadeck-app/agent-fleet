# Execution detail (`flow show <id>`), mounted at /modules/flow/executions/:id. ":id" of the manifest path is $route.id.
# ?tail=<chars> sets how much of a failed step's output is kept; ?full=true lifts the limit.
# Slot "flow:execution-actions" (manifest expose.slots): other modules add buttons beside the badges. Their views are
# rendered with this page's context, so they can read $route.id and $sources.execution.<field> (whole-string expressions only).
# The steps table has three short columns (a narrow page breaks longer cells mid-word): the status word carries retries
# and recovered errors ("ok, recovered, 3 tries"); the error text is in the output below.
$sources:
    execution:
        # A placeholder is filled from params; the module id stays literal.
        url: GET /api/modules/flow/executions/{id}
        params:
            id: $route.id
            tail: $urlParam.tail
            full: $urlParam.full
    actions:
        url: GET /api/slots/flow:execution-actions

$type: PageContent
sections:
    - $type: Link
      label: Back to executions
      href: /modules/flow/executions
      variant: muted

    - $type: PageHeader
      title: $sources.execution.flowId
      subtitle: $sources.execution.executionId

    - $type: HorizontalStack
      gap: gap-3
      align: items-center
      justify: justify-between
      items:
          - $type: HorizontalStack
            gap: gap-3
            align: items-center
            items:
                - {
                      $type: Badge,
                      label: $sources.execution.statusText,
                      variant: $sources.execution.statusVariant,
                      tone: subtle,
                  }
                - { $type: Badge, label: $sources.execution.duration, variant: info }
                - { $type: Badge, label: $sources.execution.startedAt, variant: default }

          # Renders nothing while no module contributes.
          - $type: ExtensionSlot
            items: $sources.actions

    - $type: Section
      title: Steps
      items:
          - $type: DataTable
            rows: $sources.execution.steps
            emptyMessage: This execution has no step
            columns:
                - { key: 'stepId', label: 'Step' }
                - { key: 'statusLabel', label: 'Status' }
                - { key: 'duration', label: 'Duration' }

    - $type: Section
      title: Output (same text as `flow show`, with the error and the tail of failed steps)
      items:
          - $type: JsonViewer
            row: $sources.execution
            field: text
            maxHeight: 40rem
