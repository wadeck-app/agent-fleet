# Worker detail, mounted at /modules/flow/workers/:workerId. ":workerId" of the manifest path is $route.workerId.
# The worker (live, or "exited" when only its log is left), then the tail of its log (secrets masked when written,
# GET /workers/:workerId/logs). A worker the daemon forked has its process output (stdout, stderr); any other has what the
# daemon observed of it (connection, steps, disconnect) plus its own output lines when it ships them. The route says in
# `reason` when there is nothing to show (file removed, daemon predates the logs), shown as the notice below instead of an
# empty viewer. ?lines=<n> sets the tail size (default 200, at most 2000). An id that is neither live nor the key of a log
# answers the not-found notice (NotFoundNotice.ts).
$sources:
    worker:
        url: GET /api/modules/flow/workers/{workerId}/logs
        params:
            workerId: $route.workerId
            lines: $urlParam.lines

$type: PageContent
sections:
    # Content only for a worker that is connected: a missing one answers the notice below.
    - $type: VerticalStack
      $if: $sources.worker.found
      gap: gap-4
      items:
          - $type: PageHeader
            title: $sources.worker.workerId
            subtitle: Worker log as kept by the daemon

          - $type: DataTable
            rows: $sources.worker.summary
            columns:
                - { key: 'state', label: 'State', nowrap: true, badge: { idle: default, busy: info, exited: warning } }
                - { key: 'heldBy', label: 'Held by run', truncate: true, mono: true }
                - { key: 'pid', label: 'PID', nowrap: true, mono: true }
                - { key: 'version', label: 'Version', nowrap: true, mono: true }
                - { key: 'sourceId', label: 'Source', truncate: true }
                - { key: 'origin', label: 'Origin', nowrap: true }
                - { key: 'hasUserInterface', label: 'Interactive', nowrap: true }
                - { key: 'lastWritten', label: 'Log last written', nowrap: true, format: datetime, dateStyle: short }
                - { key: 'sizeBytes', label: 'Log size (bytes)', nowrap: true, mono: true }

          - $type: HorizontalStack
            gap: gap-3
            align: items-center
            items:
                - $type: CompactSelect
                  urlParam: lines
                  ariaLabel: Lines
                  placeholder: Last 200 lines
                  options:
                      - { value: '200', label: Last 200 lines }
                      - { value: '1000', label: Last 1000 lines }
                      - { value: '2000', label: Last 2000 lines }

          # Why there is no output to show (external worker, file removed); '' = there is a log.
          - {
                $type: Badge,
                $if: $sources.worker.hasReason,
                label: $sources.worker.reason,
                variant: warning,
                tone: subtle,
            }

          - $type: Section
            $if: $sources.worker.available
            title: Log (oldest first; out/err = the worker's output, dmn = what the daemon observed)
            items:
                - $type: JsonViewer
                  $if: $sources.worker.hasLines
                  row: $sources.worker
                  field: text
                  maxHeight: 40rem
                - {
                      $type: Badge,
                      $if: $sources.worker.lacksLines,
                      label: This worker has written nothing yet,
                      variant: default,
                  }

    # Same not-found state as the other detail pages (texts from the route, NotFoundNotice.ts).
    - $type: VerticalStack
      $if: $sources.worker.notFound
      gap: gap-3
      items:
          - { $type: PageHeader, title: $sources.worker.title, subtitle: $sources.worker.message }
          - {
                $type: ButtonLink,
                size: sm,
                variant: secondary,
                label: $sources.worker.listLabel,
                to: $sources.worker.listHref,
            }
