# Dashboard widget, built for a narrow cell (a 240px card). Three designs are declared as an A/B test (README: "Design
# variants"); the dev shell's A/B dock picks one, `list` is what everybody else sees.
# One precomputed source (GET /api/modules/flow/widgets/executions): the DSL cannot put a status mark in front of a name.
# Times are ISO 8601 (startedAt) shown by a column with `format: datetime`, the shell formatter of every app-core table
# (no relative "5m" text composed by the backend, no timestamp inside a StatTile or a Badge: neither can format it). A
# shell older than dsl-ui 122 ignores `format` and shows the raw ISO text.
# `list` reads `title`, "tag name" cut to MAX_WIDGET_TITLE_LENGTH characters by the backend, next to the start time.
# `compact` has real columns instead, and truncates the name itself (dsl-ui 122 DataTable `truncate`/`nowrap`/`badge`;
# a shell older than 122 shows the plain text).
# `&viewAll` is defined once, in the first variant: keep that variant, or move the anchor, when removing variants.
$sources:
    recent:
        url: GET /api/modules/flow/widgets/executions
        poll: 30s

$type: AbTest
id: flow-widget-design
label: Flow widget
initial: list
variants:
    list:
        label: List
        hint: 'Two counters, the 5 latest runs as one line each (status word, name, start time), then a link.'
        view:
            $type: VerticalStack
            gap: gap-2
            items:
                # Stacked, not side by side: two tiles in a row do not fit a 160px card.
                - { $type: StatTile, label: Running, value: $sources.recent.running }
                - { $type: StatTile, label: Failed, value: $sources.recent.failed }

                - $type: DataTable
                  rows: $sources.recent.items
                  navigateTo: '/modules/flow/executions/{executionId}'
                  emptyMessage: No execution yet
                  columns:
                      - { key: 'title', label: 'Recent runs', nowrap: true }
                      - { key: 'startedAt', label: 'Started', format: datetime, muted: true }

                - &viewAll { $type: Link, label: $sources.recent.viewAllLabel, href: /modules/flow/executions }

    tiles:
        label: Tiles
        hint: 'Three numbers (running, failed, total) in tiles and the start of the last run: no list, just the state.'
        view:
            $type: VerticalStack
            gap: gap-2
            items:
                - $type: HorizontalStack
                  gap: gap-2
                  itemSizes: [flex, flex]
                  items:
                      - { $type: StatTile, label: Running, value: $sources.recent.running }
                      - { $type: StatTile, label: Failed, value: $sources.recent.failed }
                - { $type: StatTile, label: Total, value: $sources.recent.total }

                # One row (none before the first run): a StatTile cannot format a timestamp, a table column can.
                - $type: DataTable
                  rows: $sources.recent.lastRun
                  emptyMessage: No execution yet
                  columns:
                      - { key: 'startedAt', label: 'Last run', format: datetime, nowrap: true }
                - *viewAll

    compact:
        label: Compact
        hint: 'No counters: the 8 latest runs in one dense table (status badge, flow name, start time) so failures show by colour.'
        view:
            $type: VerticalStack
            gap: gap-2
            items:
                - $type: DataTable
                  rows: $sources.recent.compact
                  navigateTo: '/modules/flow/executions/{executionId}'
                  emptyMessage: No execution yet
                  columns:
                      - key: statusLabel
                        label: Status
                        nowrap: true
                        badge: { ok: success, FAILED: danger, running: info, waiting: default, retry: warning }
                      - { key: 'flowId', label: 'Flow', truncate: true }
                      - { key: 'startedAt', label: 'Started', format: datetime, muted: true }
                - *viewAll
