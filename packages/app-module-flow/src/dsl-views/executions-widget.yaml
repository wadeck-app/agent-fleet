# Dashboard widget for a narrow card (240-360px): three counters on one row, the daily bars of the last 7 days, the 5
# latest runs and a row of buttons. One source feeds all of it:
#   recent: GET /api/modules/flow/widgets/executions, the digest of the runs (flow-core RunDigest, served as is)
# Times are ISO 8601 shown by a DataTable column with `format: datetime`, formatted by the shell (a StatTile or a composed
# string would show the raw text). A shell older than dsl-ui 122 ignores `format`.
# When the source cannot be read the renderer only logs it: the list falls back to its emptyMessage, numbers stay blank,
# nothing throws.
$sources:
    recent:
        url: GET /api/modules/flow/widgets/executions
        poll: 30s

$type: VerticalStack
gap: gap-2
items:
    # StatTile has no size prop: the height comes from the one-row layout, three tiles share the card width.
    - $type: HorizontalStack
      gap: gap-1.5
      itemSizes: [flex, flex, flex]
      items:
          - { $type: StatTile, label: Running, value: $sources.recent.running }
          - { $type: StatTile, label: Failed, value: $sources.recent.failed }
          - { $type: StatTile, label: Total, value: $sources.recent.total }

    # Runs of the last 7 days, one green (completed) and one red (failed) bar per day. Hover a bar for the date.
    - $type: Chart
      data: $sources.recent.daily
      xAxisKey: dayStart
      xAxisType: time
      xFormat: date
      yFormat: number
      variant: sparkline
      height: 64
      series:
          - { key: completed, name: completed, color: 'var(--color-success)', type: bar, yAxisId: left }
          - { key: failed, name: failed, color: 'var(--color-danger)', type: bar, yAxisId: left }

    # The 5 newest runs, a row opens the run. The flow name is sent whole: its column takes the room the narrow columns leave.
    - $type: DataTable
      rows: $sources.recent.latest
      navigateTo: '/modules/flow/executions/{executionId}'
      emptyMessage: No execution yet
      columns:
          - key: statusLabel
            label: Status
            nowrap: true
            badge: { ok: success, FAILED: danger, running: info, waiting: default, retry: warning }
          - { key: 'flowId', label: 'Flow', truncate: true }
          - { key: 'startedAt', label: 'Started', format: datetime, nowrap: true }

    # The charts need the flow-chart module: without it the last button leads to a missing page.
    - $type: HorizontalStack
      gap: gap-1.5
      items:
          - { $type: ButtonLink, to: /modules/flow/executions, label: Runs, variant: secondary, size: sm }
          - { $type: ButtonLink, to: /modules/flow/workers, label: Workers, variant: secondary, size: sm }
          - { $type: ButtonLink, to: /modules/flow-chart/flows, label: Charts, variant: secondary, size: sm }
