# Workers (`flow worker list`): live workers, declared sources, and why the list is empty when it is.
$sources:
    workers:
        url: GET /api/modules/flow/workers
    recent:
        url: GET /api/modules/flow/workers/recent

$type: PageContent
sections:
    - $type: PageHeader
      title: Flow workers
      subtitle: Live workers as the daemon reports them

    - $type: Section
      title: Live workers
      items:
          - $type: DataTable
            rows: $sources.workers.workers
            emptyMessage: No worker is connected
            columns:
                # The icon link to the worker's page (its summary and captured output): same pattern as the executions list.
                - { type: link, to: '/modules/flow/workers/{workerId}', icon: eye, label: Open worker, position: start }
                - { key: 'workerId', label: 'Worker', truncate: true, mono: true }
                # The state is idle or busy (WorkerSummary); a shell older than dsl-ui 122 shows the word as it is.
                - { key: 'state', label: 'State', nowrap: true, badge: { idle: default, busy: info } }
                # The run this worker keeps a resource (a sandbox) for; empty when none (also from a daemon that predates it).
                - { key: 'heldBy', label: 'Held by run', truncate: true, mono: true }
                - { key: 'pid', label: 'PID', nowrap: true, mono: true }
                - { key: 'version', label: 'Version', nowrap: true, mono: true }
                - { key: 'sourceId', label: 'Source', truncate: true }
                - { key: 'origin', label: 'Origin', nowrap: true }
                - { key: 'hasUserInterface', label: 'Interactive', nowrap: true }

    # Workers that are gone but whose log is still on disk (7 days): the way to see why one ended. Read from the log files,
    # so it also works when no daemon runs. The key is a pid (started by the daemon) or a worker id.
    - $type: Section
      title: Recent workers (exited, log kept 7 days)
      items:
          - $type: DataTable
            rows: $sources.recent.recent
            emptyMessage: No worker log on disk
            columns:
                - { type: link, to: '/modules/flow/workers/{key}', icon: eye, label: Open worker log, position: start }
                - { key: 'key', label: 'Worker', truncate: true, mono: true }
                - { key: 'origin', label: 'Origin', nowrap: true }
                - { key: 'modifiedAt', label: 'Last written', nowrap: true, format: datetime, dateStyle: short }
                - { key: 'sizeBytes', label: 'Size (bytes)', nowrap: true, mono: true }
                - { key: 'lastLine', label: 'Last line', truncate: true, mono: true }

    - $type: Section
      title: Declared sources (capacity that can be started, not workers)
      items:
          - $type: DataTable
            rows: $sources.workers.declaredSources
            emptyMessage: No source declared
            columns:
                - { key: 'sourceId', label: 'Source', truncate: true }
                - { key: 'provider', label: 'Provider', nowrap: true }
                - { key: 'maxWorkers', label: 'Max workers', nowrap: true }

    - $type: Section
      title: Why the list may be empty
      items:
          - $type: JsonViewer
            row: $sources.workers
            field: emptyExplanation
