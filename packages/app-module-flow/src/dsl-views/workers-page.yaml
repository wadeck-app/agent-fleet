# Workers (`flow worker list`): live workers, declared sources, and why the list is empty when it is.
$sources:
    workers:
        url: GET /api/modules/flow/workers

$type: PageContent
sections:
    - $type: PageHeader
      title: Flow workers
      subtitle: Live workers as the daemon reports them

    - $type: Section
      title: Live workers
      items:
          - $type: DataTable
            rows: $sources.workers.workers
            emptyMessage: No worker is connected
            columns:
                - { key: 'workerId', label: 'Worker', truncate: true, mono: true }
                # The state is idle or busy (WorkerSummary); a shell older than dsl-ui 122 shows the word as it is.
                - { key: 'state', label: 'State', nowrap: true, badge: { idle: default, busy: info } }
                - { key: 'pid', label: 'PID', nowrap: true, mono: true }
                - { key: 'version', label: 'Version', nowrap: true, mono: true }
                - { key: 'sourceId', label: 'Source', truncate: true }
                - { key: 'hasUserInterface', label: 'Interactive', nowrap: true }

    - $type: Section
      title: Declared sources (capacity that can be started, not workers)
      items:
          - $type: DataTable
            rows: $sources.workers.declaredSources
            emptyMessage: No source declared
            columns:
                - { key: 'sourceId', label: 'Source', truncate: true }
                - { key: 'provider', label: 'Provider', nowrap: true }
                - { key: 'maxWorkers', label: 'Max workers', nowrap: true }

    - $type: Section
      title: Why the list may be empty
      items:
          - $type: JsonViewer
            row: $sources.workers
            field: emptyExplanation
