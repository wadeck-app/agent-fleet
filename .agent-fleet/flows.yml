# Combined Example: All Types Together
example-comprehensive:
    version: '1.0.0'
    name: 'Example: Comprehensive Input Types'
    description: 'Demonstrates multiple input types in one flow'
    workspace:
        mode: isolated
        gitStrategy: feature-branch
        reusePolicy: never
    inputs:
        # Text types
        description:
            type: text
            required: true
            description: 'Project description'
        project_url:
            type: url
            required: false
            description: 'Project website URL'
        # Number types
        team_size:
            type: integer
            required: true
            default: 5
            description: 'Team size'
        completion_percent:
            type: percentage
            required: false
            description: 'Current completion percentage'
        # Selection types
        project_type:
            type: enum
            required: true
            description: 'Type of project'
            options:
                options:
                    - { value: 'web', label: 'Web Application' }
                    - { value: 'mobile', label: 'Mobile App' }
                    - { value: 'api', label: 'API Service' }
        technologies:
            type: multi-enum
            required: true
            description: 'Technologies used'
            options:
                options:
                    - { value: 'react', label: 'React' }
                    - { value: 'node', label: 'Node.js' }
                    - { value: 'python', label: 'Python' }
                    - { value: 'go', label: 'Go' }
        priority:
            type: priority
            required: true
            default: 'medium'
            description: 'Project priority'
        # Date types
        deadline:
            type: date
            required: true
            description: 'Project deadline'
        # File types
        config_file:
            type: file
            required: false
            description: 'Configuration file'
        # Structure types
        dependencies:
            type: array
            required: false
            description: 'List of dependencies'
        metadata:
            type: keyvalue
            required: false
            description: 'Project metadata'
    steps:
        - type: model
          id: analyze-project
          name: 'Analyze Project'
          model: sonnet
          prompt: |
              Analyze this project:

              Description: ${{ inputs.description }}
              URL: ${{ inputs.project_url || 'N/A' }}
              Type: ${{ inputs.project_type }}
              Technologies: ${{ inputs.technologies }}
              Team Size: ${{ inputs.team_size }}
              Priority: ${{ inputs.priority }}
              Deadline: ${{ inputs.deadline }}
              Completion: ${{ inputs.completion_percent || 0 }}%

              Dependencies: ${{ inputs.dependencies || '[]' }}
              Metadata: ${{ inputs.metadata || '{}' }}

              Provide project analysis and recommendations.

