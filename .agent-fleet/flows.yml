# Text Types Examples
example-blog-post:
    version: '1.0.0'
    name: 'Example: Blog Post Generator'
    description: 'Demonstrates text, url, and markdown types'
    workspace:
        mode: shared
        gitStrategy: any
        reusePolicy: if-available
    inputs:
        topic:
            type: text
            required: true
            description: 'Blog post topic (can be multiple paragraphs)'
        reference_url:
            type: url
            required: false
            description: 'Optional reference URL for research'
        existing_content:
            type: markdown
            required: false
            description: 'Existing markdown content to expand on'
    steps:
        - type: model
          id: generate-post
          name: 'Generate Blog Post'
          model: sonnet
          prompt: |
              Create a blog post about: ${{ inputs.topic }}

              Reference URL: ${{ inputs.reference_url || 'None provided' }}
              Existing content: ${{ inputs.existing_content || 'None' }}

              Generate a well-structured blog post in markdown format.

# Number Types Examples
example-performance-metrics:
    version: '1.0.0'
    name: 'Example: Performance Metrics Analyzer'
    description: 'Demonstrates integer, percentage, and duration types'
    workspace:
        mode: shared
        gitStrategy: any
        reusePolicy: if-available
    inputs:
        max_iterations:
            type: integer
            required: true
            default: 10
            description: 'Maximum number of test iterations'
        success_threshold:
            type: percentage
            required: true
            default: 95
            description: 'Required success rate percentage'
        timeout_seconds:
            type: duration
            required: true
            default: 300
            description: 'Timeout in seconds'
    steps:
        - type: script
          id: run-tests
