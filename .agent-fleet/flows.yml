    inputs:
        topic:
            type: text
            required: true
            description: 'Blog post topic (can be multiple paragraphs)'
        reference_url:
            type: url
            required: false
            description: 'Optional reference URL for research'
        existing_content:
            type: markdown
            required: false
            description: 'Existing markdown content to expand on'
    steps:
        - type: model
          id: generate-post
          name: 'Generate Blog Post'
          model: sonnet
          prompt: |
              Create a blog post about: ${{ inputs.topic }}

              Reference URL: ${{ inputs.reference_url || 'None provided' }}
              Existing content: ${{ inputs.existing_content || 'None' }}

              Generate a well-structured blog post in markdown format.

# Number Types Examples
example-performance-metrics:
    version: '1.0.0'
    name: 'Example: Performance Metrics Analyzer'
    description: 'Demonstrates integer, percentage, and duration types'
    workspace:
        mode: shared
        gitStrategy: any
        reusePolicy: if-available
    inputs:
        max_iterations:
            type: integer
            required: true
            default: 10
            description: 'Maximum number of test iterations'
        success_threshold:
            type: percentage
            required: true
            default: 95
            description: 'Required success rate percentage'
        timeout_seconds:
            type: duration
            required: true
            default: 300
            description: 'Timeout in seconds'
    steps:
        - type: script
          id: run-tests
          name: 'Run Performance Tests'
          script: |
              echo "Running ${{ inputs.max_iterations }} iterations"
              echo "Success threshold: ${{ inputs.success_threshold }}%"
              echo "Timeout: ${{ inputs.timeout_seconds }}s"
          output:
              result: { type: string }

# Selection Types Examples
example-deployment-workflow:
    version: '1.0.0'
    name: 'Example: Deployment Workflow'
    description: 'Demonstrates enum, multi-enum, and priority types'
    workspace:
        mode: isolated
        gitStrategy: feature-branch
        reusePolicy: never
    inputs:
        environment:
            type: enum
            required: true
            description: 'Target deployment environment'
            options:
